[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shomer-gate"
version = "0.1.0"
description = "Guardrail gateway for LLM traffic: a deterministic baseline decides, the model is measured against it, and every verdict is written to a tamper-evident ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juliano Vince de Campos" }]
keywords = ["llm", "guardrail", "prompt-injection", "ai-security", "llmops", "devsecops"]

# The API extra is optional on purpose. The engine imports with zero deps.
[project.optional-dependencies]
api = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
shomer = "shomer_gate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=shomer_gate --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["shomer_gate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]
