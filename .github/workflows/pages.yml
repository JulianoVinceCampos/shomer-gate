name: pages

# Publishes the static console to GitHub Pages. The front has an offline demo
# mode: with no backend reachable it runs the same rules in the browser, so the
# Pages site is a working, zero-cost live demo (no server, no cold start).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: upload the console (web/) as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4
