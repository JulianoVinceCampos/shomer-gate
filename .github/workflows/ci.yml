name: ci

# The pipeline is blocking by design: every gate below must pass before a merge
# is allowed. The order mirrors the engineering standard: secrets first, then
# lint, then a version matrix, coverage with a ratchet, SAST, SCA, the quality
# gate (the eval gate is domain-specific here), an SBOM and a provenance
# attestation. CodeQL runs in codeql.yml and is a required check too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret sanitisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,api]"
      - name: ruff
        run: ruff check src tests
      - name: mypy (strict)
        run: mypy

  test:
    name: test ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,api]"
      - name: pytest with coverage ratchet (fails under 85%)
        run: pytest --cov-report=xml
      - name: domain quality gate (baseline vs. ground truth)
        run: python -m shomer_gate eval --min-recall 0.80 --max-fpr 0.05
      - name: upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep
      - name: semgrep
        run: semgrep scan --config=auto --error --metrics=off src

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: audit runtime dependencies
        run: pip-audit -r requirements.txt --strict

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cyclonedx-bom
      - name: generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt --output-format json --outfile sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  image:
    name: container build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t shomer-gate:ci .
      - name: smoke test the image
        run: |
          docker run -d --name shomer -p 8080:8080 shomer-gate:ci
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/api/health > /dev/null; then echo ok; break; fi
            sleep 1
          done
          curl -fs http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f shomer

  provenance:
    name: provenance attestation
    runs-on: ubuntu-latest
    needs: [secrets, lint, test, sast, sca, sbom, image]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: attest the SBOM provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom.json

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs: [secrets, lint, test, sast, sca, sbom, image, provenance]
    steps:
      - run: echo "All gates green. Merge allowed."
